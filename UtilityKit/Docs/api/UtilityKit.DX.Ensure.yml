  namespace: UtilityKit.DX
  summary: Starts a fluent validation chain for the given value.
  example:
  - >-
    <pre><code class="lang-csharp">// Simple null check

    var result = Ensure.That(customer).NotNull().Result;

    if (!result.IsValid) Console.WriteLine(result.Message);


    // Chained checks

    var r2 = Ensure.That(orderId)
        .NotNull()
        .NotEmpty("Order id required")
        .Result;

    // Using a custom predicate

    var r3 = Ensure.That(age).InRange(18, 65).Result;

    if (!r3.IsValid) Console.WriteLine(r3.Message);</code></pre>
  syntax:
