    id: Encrypt
    path: ../Crypto/AesEncryptionService .cs
    startLine: 89
  assemblies:
  - UtilityKit
  namespace: UtilityKit.Crypto
  summary: >-
    Encrypts the given plain text using AES and returns the cipher text

    and the initialization vector (IV) that must be supplied for

    decryption.
  example:
  - >-
    <pre><code class="lang-csharp">// Startup/Program.cs - register the service with DI

    var key = new byte[32];

    RandomNumberGenerator.Fill(key);

    services.AddSingleton&lt;IEncryptionService&gt;(new AesEncryptionService(key));


    // Consuming class via constructor injection

    public class MyController

    {
        private readonly IEncryptionService _enc;
        public MyController(IEncryptionService enc) =&gt; _enc = enc;

        public void Do()
        {
            var (cipher, iv) = _enc.Encrypt("secret");
            var cipherB64 = Convert.ToBase64String(cipher);
            var ivB64 = Convert.ToBase64String(iv);
        }
    }</code></pre>
  syntax:
    content: public (byte[] cipherText, byte[] iv) Encrypt(string plainText)
    parameters:
    - id: plainText
      type: System.String
      description: The plain text to encrypt.
    return:
      type: System.ValueTuple{System.Byte[],System.Byte[]}
      description: >-
        A tuple containing the encrypted bytes as <code>cipherText</code> and the

        <code>iv</code> used for the encryption operation.
    content.vb: Public Function Encrypt(plainText As String) As (cipherText As Byte(), iv As Byte())
