    path: ../Crypto/AesEncryptionService .cs
    startLine: 133
  assemblies:
  - UtilityKit
  namespace: UtilityKit.Crypto
  summary: >-
    Decrypts the specified cipher text using the provided initialization

    vector and returns the resulting plain text.
  example:
  - >-
    <pre><code class="lang-csharp">// Startup/Program.cs - register the service with DI

    var key = new byte[32];

    RandomNumberGenerator.Fill(key);

    services.AddSingleton&lt;IEncryptionService&gt;(new AesEncryptionService(key));


    // Consuming class via constructor injection

    public class MyController

    {
        private readonly IEncryptionService _enc;
        public MyController(IEncryptionService enc) =&gt; _enc = enc;

        public void Do(string cipherB64, string ivB64)
        {
            var cipher = Convert.FromBase64String(cipherB64);
            var iv = Convert.FromBase64String(ivB64);
            var plain = _enc.Decrypt(cipher, iv);
        }
    }</code></pre>
  syntax:
    content: public string Decrypt(byte[] cipherText, byte[] iv)
    parameters:
    - id: cipherText
      type: System.Byte[]
      description: The encrypted bytes to decrypt.
    - id: iv
      type: System.Byte[]
      description: The initialization vector that was used to encrypt the data.
    return:
      type: System.String
      description: The decrypted plain text.
    content.vb: Public Function Decrypt(cipherText As Byte(), iv As Byte()) As String
