    startLine: 16
  assemblies:
  - UtilityKit
  namespace: UtilityKit.Extensions.String
  summary: Parsing and conversion string extension methods.
  remarks: >-
    Example usage:

    <pre><code class="lang-csharp">var i = "123".ParseIntOrDefault(); // 123

    var bad = "abc".ParseIntOrDefault(-1); // -1

    if ("2025-12-15".TryParseDateTime(out var dt)) Console.WriteLine(dt);

    var unix = "2025-12-15".ToUnixTimestamp();

    Guid.TryToGuid("...", out var g);

    var uri = "https://example.com".ToUri();</code></pre>
  example: []
