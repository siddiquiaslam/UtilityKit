  namespace: UtilityKit.Crypto
  summary: >-
    Encrypts the specified plain text and returns the cipher text together

    with the initialization vector (IV) used for encryption.
  example: []
  syntax:
    content: (byte[] cipherText, byte[] iv) Encrypt(string plainText)
    parameters:
    - id: plainText
      type: System.String
      description: The UTF-8 plain text to encrypt.
    return:
      type: System.ValueTuple{System.Byte[],System.Byte[]}
      description: >-
        A tuple containing the encrypted bytes as <code>cipherText</code> and the

        initialization vector as <code>iv</code> required for decryption.
    content.vb: Function Encrypt(plainText As String) As (cipherText As Byte(), iv As Byte())
