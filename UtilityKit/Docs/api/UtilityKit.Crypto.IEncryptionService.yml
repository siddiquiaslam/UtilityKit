  assemblies:
  - UtilityKit
  namespace: UtilityKit.Crypto
  summary: >-
    Decrypts the specified cipher text using the provided initialization

    vector and returns the resulting UTF-8 plain text.
  example: []
  syntax:
    content: string Decrypt(byte[] cipherText, byte[] iv)
    parameters:
    - id: cipherText
      type: System.Byte[]
      description: The encrypted data to decrypt.
    - id: iv
      type: System.Byte[]
      description: The initialization vector that was used to encrypt the data.
    return:
      type: System.String
      description: The decrypted plain text.
    content.vb: Function Decrypt(cipherText As Byte(), iv As Byte()) As String
