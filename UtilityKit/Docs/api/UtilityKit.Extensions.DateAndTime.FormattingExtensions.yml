  assemblies:
  - UtilityKit
  namespace: UtilityKit.Extensions.DateAndTime
  summary: Converts a <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> value into a human-readable relative time string.
  remarks: >-
    This method uses approximate calculations for months and years based on days

    (30 days ≈ 1 month, 365 days ≈ 1 year). For precise calendar calculations,

    consider using <xref href="System.Globalization.Calendar" data-throw-if-not-resolved="false"></xref> methods.
  example: []
  syntax:
    content: public static string ToRelativeTime(this DateTime dateTime)
    parameters:
    - id: dateTime
      type: System.DateTime
      description: The <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> value to convert. The input is normalized to UTC before comparison.
    return:
      type: System.String
      description: >-
        A string representing the relative time difference between the specified <code class="paramref">dateTime</code>

        and the current UTC time. Examples include:

        <ul><li>"just now"</li><li>"5 minutes ago"</li><li>"yesterday"</li><li>"2 weeks ago"</li><li>"3 months ago"</li><li>"2 years ago"</li></ul>
    content.vb: Public Shared Function ToRelativeTime(dateTime As Date) As String
  overload: UtilityKit.Extensions.DateAndTime.FormattingExtensions.ToRelativeTime*
  nameWithType.vb: FormattingExtensions.ToRelativeTime(Date)
  fullName.vb: UtilityKit.Extensions.DateAndTime.FormattingExtensions.ToRelativeTime(Date)
  name.vb: ToRelativeTime(Date)
